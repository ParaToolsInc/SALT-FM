# Config variables:
#   ${full_timer_name}: "function_name [file_path {start}-{end}]".
#   Put it only inside a "..." string literal: SALT-FM escapes it for one.

instrumentation: Perfstubs
include:
  - "\"perfstubs_api/timer.h\""

# Setup code at the start of main, inserted even when the selective
# instrumentation file removes main's timer
main_setup_insert:
  - "PERFSTUBS_INITIALIZE();"

# main's timer, inserted after main_setup_insert when the selective
# instrumentation file keeps it
main_insert:
  - "PERFSTUBS_TIMER_START_FUNC(_timer);"

function_begin_insert:
  - "PERFSTUBS_TIMER_START_FUNC(_timer);"

function_end_insert:
  - "PERFSTUBS_TIMER_STOP_FUNC(_timer);"
