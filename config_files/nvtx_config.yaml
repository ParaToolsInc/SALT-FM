# Config variables:
#   ${full_timer_name}: "function_name [file_path {start}-{end}]".
#   Put it only inside a "..." string literal: SALT-FM escapes it for one.

instrumentation: NVTX
include:
  - "\"nvToolsExt.h\""

main_insert:
  - "nvtxRangePushA(\"${full_timer_name}\");"

function_begin_insert:
  - "nvtxRangePushA(\"${full_timer_name}\");"

function_end_insert:
  - "nvtxRangePop();"
