# Config variables:
#   ${full_timer_name}: "function_name [file_path {start}-{end}]",
#   escaped for a "..." string literal

instrumentation: ROCTX
include:
  - "\"roctracer_ext.h\""

main_insert:
  - "roctxRangePush(\"${full_timer_name}\");"

function_begin_insert:
  - "roctxRangePush(\"${full_timer_name}\");"

function_end_insert:
  - "roctxRangePop();"
