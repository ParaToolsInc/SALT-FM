name: macOS
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.VERSION'
      - 'LICENSE*'
      - '.gitignore'
      - '.githooks/**'
      - 'docs/**'
      - '.github/workflows/CI.yaml'
      - '.github/workflows/lint.yaml'
      - '.github/workflows/version-check.yaml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.VERSION'
      - 'LICENSE*'
      - '.gitignore'
      - '.githooks/**'
      - 'docs/**'
      - '.github/workflows/CI.yaml'
      - '.github/workflows/lint.yaml'
      - '.github/workflows/version-check.yaml'

jobs:
  build:
    name: macOS (Homebrew LLVM, no TAU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build deps via Homebrew
        run: |
          brew update --quiet
          brew install --quiet llvm flang ninja

      - name: Resolve toolchain paths
        id: paths
        run: |
          {
            echo "LLVM_PREFIX=$(brew --prefix llvm)"
            echo "NCPU=$(sysctl -n hw.ncpu)"
            echo "FLANG_VERSION=$(brew list --versions flang | tr ' ' -)"
            echo "LLVM_VERSION=$(brew list --versions llvm | tr ' ' -)"
          } >> "$GITHUB_OUTPUT"

      # The pinned MPICH tarball, cached under its SHA-256, where the
      # build downloads it; the build does not download it again
      - name: Get the SHA-256 of the MPICH tarball
        id: mpich
        run: >
          sed -n 's/^set(SALT_MPICH_SHA256 \([0-9a-f]*\))$/sha256=\1/p'
          cmake/modules/SALTMPI.cmake >> "$GITHUB_OUTPUT"
      - name: Restore the MPICH tarball
        id: mpich-tarball
        uses: actions/cache/restore@v4
        with:
          path: build/mpich/mpich-*.tar.gz
          key: mpich-${{ steps.mpich.outputs.sha256 }}
      # The MPI files that the build makes from MPICH, which take many
      # minutes. Their stamp file holds a hash of their inputs; with the
      # same hash, the build does not make them again. The hash has the
      # versions of Flang and Clang, which Homebrew updates separately.
      - name: Restore the MPICH files
        id: mpich-files
        uses: actions/cache/restore@v4
        with:
          path: |
            build/include/salt/mpi
            build/mpich/build/mods
            build/mpich/files.stamp
          key: >-
            mpich-files-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.FLANG_VERSION }}-${{ steps.paths.outputs.LLVM_VERSION }}-${{ steps.mpich.outputs.sha256 }}-${{ hashFiles('cmake/modules/SALTMPI*.cmake') }}

      # Only CC/CXX are pinned to Homebrew LLVM. CMAKE_PREFIX_PATH,
      # CMAKE_OSX_SYSROOT, and -stdlib=libc++ are intentionally left
      # for SALT-FM's macOS auto-detect logic to populate so this CI leg
      # actually exercises the path the README recommends; if
      # auto-detect breaks, the configure-time <ryml_all.hpp> probe
      # should fail fast here. Requiring MLIR and Flang (find_package(Flang)
      # only runs once MLIR is found) stops the Fortran tests from
      # silently dropping out. Requiring Python 3, which MPICH's
      # configure needs for the MPI files of the Fortran parse, does the
      # same for the MPI tests.
      - name: Configure SALT-FM (no TAU)
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_C_COMPILER=${{ steps.paths.outputs.LLVM_PREFIX }}/bin/clang
          -DCMAKE_CXX_COMPILER=${{ steps.paths.outputs.LLVM_PREFIX }}/bin/clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_REQUIRE_FIND_PACKAGE_MLIR=ON
          -DCMAKE_REQUIRE_FIND_PACKAGE_Flang=ON
          -DCMAKE_REQUIRE_FIND_PACKAGE_Python3=ON
          -Wdev -Wdeprecated

      - name: Compile SALT-FM
        id: build
        run: |
          echo "Cores: ${{ steps.paths.outputs.NCPU }}"
          if cmake --build build --parallel "${{ steps.paths.outputs.NCPU }}" ; then
            echo "build_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "build_status=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Build failed; rerunning verbose, then failing CI"
            echo "Build failed; rerunning verbose, then failing CI"
            if ! cmake --build build --verbose ; then
              echo "::error::Verbose build failed on second attempt"
              exit 1
            fi
          fi

      # Saved now, as a cache that is saved at the end of the job is saved
      # only when every step passed
      - name: Save the MPICH tarball
        if: steps.mpich-tarball.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/mpich/mpich-*.tar.gz
          key: ${{ steps.mpich-tarball.outputs.cache-primary-key }}
      # Not without the `mpi` module, as after a failed MPICH configure:
      # the key would then never get the files of a build that works
      - name: Save the MPICH files
        if: >-
          steps.mpich-files.outputs.cache-hit != 'true' &&
          hashFiles('build/include/salt/mpi/mpich/modules/mpi.saltmod') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/include/salt/mpi
            build/mpich/build/mods
            build/mpich/files.stamp
          key: ${{ steps.mpich-files.outputs.cache-primary-key }}

      - name: Run tests (TAU-dependent tests are skipped automatically)
        working-directory: build
        run: |
          if ! ctest --no-tests=error -j "${{ steps.paths.outputs.NCPU }}" --output-on-failure ; then
            echo "::error::Tests failed, re-running tests with verbose output"
            echo "Tests failed, re-running tests with verbose output"
            if ! ctest --no-tests=error --rerun-failed --verbose ; then
              echo "::error::Rerunning failed tests failed on second attempt"
            fi
            exit 1
          fi

      # The installed saltfm, with its default configuration file
      - name: Check the installed tools
        run: .github/scripts/check-install build "$PWD/salt-install"

      - name: Fail CI on build failure
        if: ${{ steps.build.outputs.build_status == 'failure' }}
        run: echo "Failing build" ; exit 1
