name: macOS
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '.VERSION'
      - 'LICENSE*'
      - '.gitignore'
      - '.githooks/**'
      - 'docs/**'
      - '.github/workflows/CI.yaml'
      - '.github/workflows/lint.yaml'
      - '.github/workflows/version-check.yaml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.VERSION'
      - 'LICENSE*'
      - '.gitignore'
      - '.githooks/**'
      - 'docs/**'
      - '.github/workflows/CI.yaml'
      - '.github/workflows/lint.yaml'
      - '.github/workflows/version-check.yaml'

jobs:
  build:
    name: macOS (Homebrew LLVM, no TAU)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build deps via Homebrew
        run: |
          brew update --quiet
          brew install --quiet llvm flang ninja

      - name: Resolve toolchain paths
        id: paths
        run: |
          {
            echo "LLVM_PREFIX=$(brew --prefix llvm)"
            echo "NCPU=$(sysctl -n hw.ncpu)"
          } >> "$GITHUB_OUTPUT"

      # Only CC/CXX are pinned to Homebrew LLVM. CMAKE_PREFIX_PATH,
      # CMAKE_OSX_SYSROOT, and -stdlib=libc++ are intentionally left
      # for SALT-FM's macOS auto-detect logic to populate so this CI leg
      # actually exercises the path the README recommends; if
      # auto-detect breaks, the configure-time <ryml_all.hpp> probe
      # should fail fast here. Requiring MLIR and Flang (find_package(Flang)
      # only runs once MLIR is found) stops the Fortran tests from
      # silently dropping out.
      - name: Configure SALT-FM (no TAU)
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_C_COMPILER=${{ steps.paths.outputs.LLVM_PREFIX }}/bin/clang
          -DCMAKE_CXX_COMPILER=${{ steps.paths.outputs.LLVM_PREFIX }}/bin/clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_REQUIRE_FIND_PACKAGE_MLIR=ON
          -DCMAKE_REQUIRE_FIND_PACKAGE_Flang=ON
          -Wdev -Wdeprecated

      - name: Compile SALT-FM
        id: build
        run: |
          echo "Cores: ${{ steps.paths.outputs.NCPU }}"
          if cmake --build build --parallel "${{ steps.paths.outputs.NCPU }}" ; then
            echo "build_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "build_status=failure" >> "$GITHUB_OUTPUT"
            echo "::error::Build failed; rerunning verbose, then failing CI"
            echo "Build failed; rerunning verbose, then failing CI"
            if ! cmake --build build --verbose ; then
              echo "::error::Verbose build failed on second attempt"
              exit 1
            fi
          fi

      - name: Run tests (TAU-dependent tests are skipped automatically)
        working-directory: build
        run: |
          if ! ctest --no-tests=error -j "${{ steps.paths.outputs.NCPU }}" --output-on-failure ; then
            echo "::error::Tests failed, re-running tests with verbose output"
            echo "Tests failed, re-running tests with verbose output"
            if ! ctest --no-tests=error --rerun-failed --verbose ; then
              echo "::error::Rerunning failed tests failed on second attempt"
            fi
            exit 1
          fi

      # The installed saltfm, with its default configuration file
      - name: Check the installed tools
        run: |
          cmake --install build --prefix "$PWD/salt-install" > /dev/null
          salt="$PWD/salt-install/bin/saltfm"
          "$salt" tests/hello.c --tau_output=hello.inst.c
          grep -q TAU_PROFILE_START hello.inst.c
          "$salt" tests/fortran/hello.f90 --tau_output=hello.inst.F90
          grep -q TAU_PROFILE_START hello.inst.F90

      - name: Fail CI on build failure
        if: ${{ steps.build.outputs.build_status == 'failure' }}
        run: echo "Failing build" ; exit 1
