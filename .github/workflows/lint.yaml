name: lint
on:
  push:
  pull_request:

jobs:
  lint:
    name: lint
    # ubuntu-slim is a 1-core, container-based standard runner with a
    # minimal preinstalled toolset (shellcheck included). Free on
    # public repos, 15 min hard job cap. Plenty for a ~30 s lint job.
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      # shellcheck is preinstalled on ubuntu-slim; no apt step needed.
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install cmake-lint
        run: uv tool install cmakelang --with pyyaml
      # Every tracked file whose first line runs sh or bash, as the
      # pre-commit hook selects them
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files -z | xargs -0 .githooks/shell-scripts)
          printf '%s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"
      - name: cmake-lint
        run: cmake-lint CMakeLists.txt cmake/modules/*.cmake
      # The download script at the commit of the v1.7.12 tag
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
